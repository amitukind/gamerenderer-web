    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does game development cost in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on scope, art style and platforms. A polished hyper-casual or advergame typically starts around a few thousand dollars; mid-core mobile, multiplayer or VR titles range significantly higher. Working with our India-based team, most European and US clients save 40-60% versus equivalent local teams. Send us a short brief and we will return a transparent, itemized estimate within 48 hours."
          }
        },
        {
          "@type": "Question",
          "name": "Do you work with clients in Europe and the USA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — the majority of our clients are in Europe (Germany, UK, Netherlands, France) and North America. We guarantee daily working-hours overlap with your time zone, communicate in fluent English over your preferred tools (Slack, Teams, Jira, Linear), and run demos and reviews at times that suit you."
          }
        },
        {
          "@type": "Question",
          "name": "Which platforms and engines do you develop for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We ship for web (WebGL/HTML5), iOS, Android, Windows, macOS, Steam, consoles and XR headsets. Our core engines are Unity and web technologies such as Three.js, PlayCanvas, Babylon.js, Phaser and PIXI — plus Unreal Engine for select 3D productions."
          }
        },
        {
          "@type": "Question",
          "name": "How do you protect our idea and intellectual property?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every engagement starts with an NDA. Contracts include full IP assignment — source code, art assets, documentation and store accounts belong to you. Code lives in repositories you control, and we are happy to work inside your infrastructure."
          }
        },
        {
          "@type": "Question",
          "name": "Can you take over or rescue an existing game project?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We regularly audit, stabilize and complete projects started elsewhere. We begin with a technical audit of the codebase and assets, give you an honest assessment, then propose a recovery plan with clear milestones."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to build a game?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A playable prototype typically takes 2-4 weeks. Hyper-casual and advergames ship in 4-10 weeks. Mid-core mobile, multiplayer and VR titles usually run 3-9 months depending on content volume. We will give you a realistic timeline — not an optimistic one — at the estimate stage."
          }
        },
        {
          "@type": "Question",
          "name": "Do you provide post-launch support and live-ops?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. Most of our client relationships continue well past launch: content updates, seasonal events, A/B testing, analytics-driven tuning, monetization optimization and platform compliance updates."
          }
        }
      ]
    }
